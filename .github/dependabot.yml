---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      github-actions-dependencies:
        patterns:
          - '*'
    cooldown:
      default-days: 1
  - package-ecosystem: docker
    directory: /src/
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      docker-dependencies:
        patterns:
          - '*'
    cooldown:
      default-days: 1
  - package-ecosystem: terraform
    directories:
      - /modules/*
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      terraform-dependencies:
        patterns:
          - '*'
    cooldown:
      default-days: 1
